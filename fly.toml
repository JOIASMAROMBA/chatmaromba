# Configuração do CHATMAROMBA na Fly.io
# Região: São Paulo (gru), perto de quem usa.
# Referência: https://fly.io/docs/reference/configuration/

app = 'chatmaromba'
primary_region = 'gru'

[build]

[env]
  # Teto de gente por sala antes de abrir "Sala 2"
  ROOM_CAPACITY = '250'

[http_service]
  internal_port = 3000
  force_https = true

  # Um chat não pode hibernar: desligar a máquina derruba todo mundo que
  # está conectado. Por isso a máquina fica sempre de pé.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    # Conexão de WebSocket fica aberta por horas, então o que importa aqui
    # é o número de conexões vivas, não requisições por segundo.
    type = 'connections'
    soft_limit = 700
    hard_limit = 900

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
